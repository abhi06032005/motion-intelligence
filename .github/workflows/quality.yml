name: MotionIQ Quality Gates

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests, lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Unit tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt 'httpx>=0.27'
      - name: Run backend test suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Verify benchmark artifact shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("research/results/phase6/phase6_loso_benchmark_summary.json")
          data = json.loads(base.read_text(encoding="utf-8"))
          assert len(data["subjects_evaluated"]) == 10
          assert data["total_streams_evaluated"] == 600
          for name, result in data["overall_summary"].items():
              n = result["tp"] + result["fp"] + result["tn"] + result["fn"]
              if name != "baseline_always_abstain":
                  assert n > 0, name
              assert result["total_samples"] == 600
          print("Artifact schema and confusion-matrix totals checked")
          PY


